name : Build Flask API Tarefas
run-name: Build Flask API Tarefas 🚀
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
permissions: 
  contents: write #da permissão de escrever para o bot do github actions
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4     #Action pronta do github que dae git clone no codigo do repositório
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4  #Action pronta do github que configura o buildx do docker
      - name: Log in to Docker Hub
        uses: docker/login-action@v4  #Action pronta do github que faz login no docker hub
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # pega o username do docker hub
          password: ${{ secrets.DOCKER_PASSWORD }}  # pega a access token do docker hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v7  #Action pronta do github que faz build e push da imagem do docker
        with:
          context: ./app  # contexto do build do docker
          push: true  # faz o push da imagem para o docker hub
          tags: samucovsk/tarefas-api:${{ github.sha }}  # tag da imagem do docker que vai ser publicada no docker hub
      - name: Update image tag in manifests/deployment.yml
        run: |
          sed -i "s|image:.*|image: samucovsk/tarefas-api:${{ github.sha }}|" manifests/deployment.yml  # substitui a tag da imagem do docker no deployment.yml
      - name: Commit and push changes to manifests/deployment.yml
        uses: EndBug/add-and-commit@v10  #Action pronta do github que faz commit e push das alterações no repositório
        with:
          message: "chore: update image tag to ${{ github.sha }}"