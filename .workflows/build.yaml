name : Build Flask API Tarefas
run-name: Build Flask API Tarefas 🚀
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3     #Action pronta do github que dae git clone no codigo do repositório
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2  #Action pronta do github que configura o buildx do docker
      - name: Log in to Docker Hub
        uses: docker/login-action@v2  #Action pronta do github que faz login no docker hub
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # pega o username do docker hub
          password: ${{ secrets.DOCKER_PASSWORD }}  # pega a access token do docker hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v4  #Action pronta do github que faz build e push da imagem do docker
        with:
          context: ./app  # contexto do build do docker, nesse caso é a raiz do repositório
          push: true  # faz o push da imagem para o docker hub
          tags: samucovsk/tarefas-api:latest  # tag da imagem do docker que vai ser publicada no docker hubb